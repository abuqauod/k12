name: Test

on:
  pull_request: {}
  # Also callable from deploy.yml so a push to main only deploys after tests pass.
  workflow_call: {}
  workflow_dispatch: {}

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck + integration tests (Docker Compose)
        working-directory: server
        run: docker compose -f docker-compose.test.yml run --rm test
      - name: Tear down
        if: always()
        working-directory: server
        run: docker compose -f docker-compose.test.yml down -v
