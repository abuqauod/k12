name: Test

on:
  pull_request: {}
  # Also callable from deploy.yml so a push to main only deploys after tests pass.
  workflow_call: {}
  workflow_dispatch: {}

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck + integration tests (Docker Compose)
        working-directory: server
        run: docker compose -f docker-compose.test.yml run --rm test
      - name: Tear down
        if: always()
        working-directory: server
        run: docker compose -f docker-compose.test.yml down -v

  # SAMS 8.6: the school app must typecheck, lint and build before a deploy.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: timetable-ui/package-lock.json
      - name: Install
        working-directory: timetable-ui
        run: npm ci
      - name: Lint
        working-directory: timetable-ui
        run: npm run lint
      - name: Typecheck + build
        working-directory: timetable-ui
        run: npm run build
