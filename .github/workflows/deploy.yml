name: Deploy to heymueen.com

on:
  push:
    branches: [main]
  # Lets you run this from the Actions tab without pushing a commit — useful
  # for testing the workflow itself (e.g. after editing deploy paths/secrets).
  workflow_dispatch: {}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # workflow_dispatch has no natural "before" commit to diff against
          # (push does) — comparing against main's own previous state makes
          # a manual run of an unchanged main deploy nothing, which is the
          # safe default; push a real commit to actually change something.
          base: main
          filters: |
            ui:
              - 'timetable-ui/**'
            server:
              - 'server/**'

  deploy-ui:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build
        working-directory: timetable-ui
        run: |
          npm ci
          npm run build

      # TODO: confirm the real nginx docroot on the VPS and update this path
      # (currently a placeholder — this step will fail until it's set).
      - name: Copy build output to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'timetable-ui/dist/*'
          target: '/var/www/heymueen.com'
          strip_components: 2
          rm: true

  deploy-server:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/k12
            git fetch origin
            git reset --hard origin/main
            cd server
            docker compose build api
            docker compose up -d api
            docker image prune -f
