name: Deploy to heymueen.com

on:
  push:
    branches: [main]
  # Lets you run this from the Actions tab without pushing a commit — useful
  # for testing the workflow itself (e.g. after editing deploy paths/secrets).
  workflow_dispatch: {}

jobs:
  test:
    uses: ./.github/workflows/test.yml

  # Always run on every push to main / manual dispatch — no path filtering.
  deploy-ui:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build
        working-directory: timetable-ui
        run: |
          npm ci
          npm run build

      # The web server's docroot for the school app: the UI_DOCROOT secret
      # when set, else the original path.
      - name: Copy build output to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'timetable-ui/dist/*'
          target: ${{ secrets.UI_DOCROOT || '/var/www/heymueen.com' }}
          strip_components: 2
          rm: true

  deploy-server:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/k12
            git fetch origin
            git reset --hard origin/main
            cd server
            export APP_RELEASE="$(git rev-parse --short HEAD)"
            docker compose build api backup
            docker compose up -d api backup
            # SAMS 8.6: the deploy fails unless the new API answers /ready
            # (database reachable) within a minute.
            for i in $(seq 1 30); do
              if docker compose exec -T api wget -qO- http://127.0.0.1:4000${ROUTE_PREFIX:-}/ready >/dev/null 2>&1; then
                echo "API ready ($APP_RELEASE)"; ok=1; break
              fi
              sleep 2
            done
            [ "${ok:-}" = 1 ] || { docker compose logs --tail=80 api; exit 1; }
            docker image prune -f
